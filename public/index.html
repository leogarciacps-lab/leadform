<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Your Free Estimate</title>

<style>
* {
    box-sizing: border-box;
}

body {
    background-color: #eef3f9;
    color: #1f2937;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    min-height: 100vh;
    padding: 40px 16px;
}

.container {
    background: #ffffff;
    border-radius: 12px;
    border-top: 6px solid #1f6fd6;
    box-shadow: 0 14px 30px rgba(0, 0, 0, 0.15);
    margin: auto;
    max-width: 560px;
    padding: 32px 40px;
    width: 100%;
}

h1 {
    color: #1f6fd6;
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 25px;
    text-align: center;
}

.form-group {
    margin-bottom: 14px;
}

.form-group label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6px;
}

input[type="text"],
input[type="email"],
input[type="tel"] {
    border: 1px solid #b8c0cc;
    border-radius: 6px;
    font: inherit;
    padding: 12px 14px;
    width: 100%;
}

input:focus {
    border-color: #1f6fd6;
    box-shadow: 0 0 0 3px rgba(31, 111, 214, 0.18);
    outline: none;
}

#consentText {
    background-color: #f5f9ff;
    border: 1px solid #d6e2f3;
    border-radius: 6px;
    font-size: 13px;
    line-height: 1.4;
    margin-top: 10px;
    min-height: 48px;
    padding: 12px;
}

.status {
    font-size: 13px;
    line-height: 1.4;
    margin: 10px 0 0;
}

.status-loading {
    color: #4b5563;
}

.status-error {
    color: #b42318;
}

.status-success {
    color: #067647;
    font-weight: 600;
}

.consent-checkbox {
    margin-top: 14px;
}

.consent-checkbox label {
    align-items: flex-start;
    cursor: pointer;
    display: flex;
    font-size: 14px;
    gap: 8px;
    line-height: 1.4;
}

.consent-checkbox input[type="checkbox"] {
    flex: 0 0 auto;
    margin-top: 3px;
}

.btn-submit {
    background: #1f6fd6;
    border: none;
    border-radius: 6px;
    color: #ffffff;
    cursor: pointer;
    font-size: 16px;
    font-weight: 700;
    margin-top: 18px;
    padding: 14px;
    width: 100%;
}

.btn-submit:hover:not(:disabled) {
    background: #195eb5;
}

.btn-submit:focus-visible {
    outline: 3px solid rgba(31, 111, 214, 0.35);
    outline-offset: 2px;
}

.btn-submit:disabled {
    background: #9cbbe9;
    cursor: not-allowed;
}

[hidden] {
    display: none !important;
}

@media (max-width: 600px) {
    body {
        padding: 20px 12px;
    }

    .container {
        padding: 26px 20px;
    }
}
</style>
</head>

<body>
<main class="container">
    <h1>Get Your Free Estimate</h1>

    <form id="leadForm" method="post" action="/submit-form">
        <!-- Hidden TCPA fields -->
        <input type="hidden" id="consentTextIPAddress" name="IPAddress">
        <input type="hidden" id="ConsentGiven" name="ConsentGiven" value="No">
        <input type="hidden" id="consentTextHidden" name="consentText">
        <input type="hidden" id="UserAgent" name="UserAgent">

        <!-- Lead fields -->
        <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" autocomplete="given-name" maxlength="80" required>
        </div>

        <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" autocomplete="family-name" maxlength="80" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" autocomplete="email" inputmode="email" maxlength="254" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" autocomplete="tel" inputmode="tel" maxlength="25">
        </div>

        <div class="form-group">
            <label for="zip">ZIP Code</label>
            <input type="text" id="zip" name="zip" autocomplete="postal-code" inputmode="numeric" maxlength="10">
        </div>

        <!-- Consent -->
        <p id="consentLoading" class="status status-loading" role="status" aria-live="polite">
            Loading consent text…
        </p>
        <div id="consentText" aria-live="polite" aria-busy="true"></div>
        <p id="consentError" class="status status-error" role="alert" hidden>
            We could not load the consent terms. Please refresh the page and try again.
        </p>

        <div class="consent-checkbox">
            <label for="consentCheckbox">
                <input type="checkbox" id="consentCheckbox" disabled required>
                <span>I agree to the terms above and consent to be contacted.</span>
            </label>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn" disabled>
            Submit
        </button>
        <p id="formStatus" class="status" role="status" aria-live="polite"></p>
    </form>
</main>

<!-- LeadExec Consent Provider -->
<script type="text/javascript">
const consentKey = '8e576c04-0a0e-406a-934a-774961b4a373';
const consentTextAppendMode = 'replace';
const consentTextLoadOnPageLoad = true;
const consentTextElementName = 'consentText';
const consentTextIPElementName = 'consentTextIPAddress';

const form = document.getElementById('leadForm');
const consentText = document.getElementById('consentText');
const consentLoading = document.getElementById('consentLoading');
const consentError = document.getElementById('consentError');
const consentCheckbox = document.getElementById('consentCheckbox');
const consentGiven = document.getElementById('ConsentGiven');
const consentTextHidden = document.getElementById('consentTextHidden');
const userAgent = document.getElementById('UserAgent');
const submitBtn = document.getElementById('submitBtn');
const formStatus = document.getElementById('formStatus');

let consentLoaded = false;
let submitting = false;

function updateSubmitState() {
    submitBtn.disabled = !consentLoaded || !consentCheckbox.checked || submitting;
}

function showConsentError() {
    consentLoading.hidden = true;
    consentError.hidden = false;
    consentText.setAttribute('aria-busy', 'false');
    consentCheckbox.disabled = true;
    consentLoaded = false;
    updateSubmitState();
}

function loadConsentProvider() {
    const consentJs = document.createElement('script');
    consentJs.type = 'text/javascript';
    consentJs.async = true;
    consentJs.src = `${document.location.protocol}//consentprovider.leadexec.net/scripts/requestJS.min.js`;
    consentJs.onerror = showConsentError;
    document.head.appendChild(consentJs);
}

function wait(milliseconds) {
    return new Promise(function (resolve) {
        window.setTimeout(resolve, milliseconds);
    });
}

async function refreshConsentCapture() {
    if (
        typeof leadExecConsentProvider === 'undefined' ||
        typeof leadExecConsentProvider.reload !== 'function' ||
        typeof leadExecConsentProviderProperties === 'undefined'
    ) {
        throw new Error('Consent provider is unavailable');
    }

    const previousConsentId = leadExecConsentProviderProperties.crid;
    const refreshDeadline = Date.now() + 10000;

    consentText.setAttribute('aria-busy', 'true');
    leadExecConsentProvider.reload();

    while (Date.now() < refreshDeadline) {
        const currentConsentId = leadExecConsentProviderProperties.crid;
        const displayedText = consentText.textContent.trim();
        const capturedIPAddress = document.getElementById('consentTextIPAddress').value;

        if (
            currentConsentId &&
            currentConsentId !== previousConsentId &&
            displayedText.length > 30 &&
            capturedIPAddress
        ) {
            consentText.setAttribute('aria-busy', 'false');

            // Give the provider time to finish uploading the refreshed page image.
            await wait(2000);
            return;
        }

        await wait(200);
    }

    consentText.setAttribute('aria-busy', 'false');
    throw new Error('Consent screenshot refresh timed out');
}

const consentStartedAt = Date.now();
const consentWatcher = window.setInterval(function () {
    const displayedText = consentText.textContent.trim();

    if (displayedText.length > 30) {
        window.clearInterval(consentWatcher);
        consentLoading.hidden = true;
        consentError.hidden = true;
        consentText.setAttribute('aria-busy', 'false');
        consentCheckbox.disabled = false;
        consentLoaded = true;
        updateSubmitState();
        return;
    }

    if (Date.now() - consentStartedAt >= 15000) {
        window.clearInterval(consentWatcher);
        showConsentError();
    }
}, 300);

consentCheckbox.addEventListener('change', function () {
    consentGiven.value = consentCheckbox.checked ? 'Yes' : 'No';
    updateSubmitState();
});

form.addEventListener('submit', async function (event) {
    event.preventDefault();

    if (!consentLoaded || !consentCheckbox.checked || submitting) {
        return;
    }

    consentGiven.value = 'Yes';
    consentTextHidden.value = consentText.textContent.trim();
    userAgent.value = navigator.userAgent;
    submitting = true;

    try {
        // Refresh the LeadExec consent request after the form is completed so
        // the certificate screenshot includes the entered values and consent.
        await refreshConsentCapture();

        consentTextHidden.value = consentText.textContent.trim();
        submitBtn.textContent = 'Submitting…';
        formStatus.className = 'status status-loading';
        formStatus.textContent = 'Submitting your information…';
        updateSubmitState();

        const response = await fetch(form.action, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'
            },
            body: new URLSearchParams(new FormData(form)).toString()
        });

        if (!response.ok) {
            throw new Error('Submission failed');
        }

        submitBtn.textContent = 'Submitted';
        formStatus.className = 'status status-success';
        formStatus.textContent = 'Lead submitted successfully!';
    } catch (error) {
        submitting = false;
        submitBtn.textContent = 'Submit';
        formStatus.className = 'status status-error';
        formStatus.textContent = 'Error submitting lead. Please try again.';
        updateSubmitState();
    }
});

loadConsentProvider();
</script>
</body>
</html>
